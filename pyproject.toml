[project]
name = "excel-crud-service"
version = "0.1.0"
description = "Сервис для загрузки, обновления и анализа табличных отчётов"
authors = [
    {name = "Pavel Korolev", email = "pdkorolev@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.121.1,<0.122.0)",
    "faststream (>=0.6.3,<0.7.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "sqlalchemy (>=2.0.44,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "alembic (>=1.17.1,<2.0.0)",
    "pydantic (>=2.12.4,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pandas-stubs (>=2.3.2.250926,<3.0.0.0)",
    "types-openpyxl (>=3.1.5.20250919,<4.0.0.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "httpx (>=0.28.1,<0.29.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
black = "^24.8.0"
isort = "^5.13.2"
mypy = "^1.13.0"
flake8 = "^7.3.0"
flake8-pyproject = "^1.2.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[tool.black]
line-length = 120
target-version = ['py311']
preview = true

[tool.isort]
profile = "wemake"
line_length = 120
combine_as_imports = true
force_sort_within_sections = true

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-ra -sv --tb=short --asyncio-mode=auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
